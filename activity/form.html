<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action=""><br>
      <label for="name">Name:</label>
      <input type="text" id="name" name="name"><br><br>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email"><br><br>

      <label for="gender">Gender:</label>
      <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
      <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>
      <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label><br><br>

      <label for="favourite class">Favourite Class:</label>
        <select name="favourite class" id="favourite class">
          <option value="math">Math</option>
          <option value="science">Science</option>
            <option value="web design">Web design</option>
        </select><br><br>  
        

      <label for="skills">Skills:</label>
        <input type="checkbox" id="skills" name="skills" value="programming">
        <label for="programming">Programming</label>
        <input type="checkbox" id="skills" name="skills" value="design">
        <label for="design">Design</label>
        <input type="checkbox" id="skills" name="skills" value="writing">
        <label for="writing">Writing</label><br><br>

      <label for="message">Message:</label><br>

      <textarea id="message" name="message"></textarea><br><br>

      <input type="submit" value="Submit">    
    </form>
</body>
</html>
